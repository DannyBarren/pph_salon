[project]
name = "pph-backend"
version = "0.1.0"
description = "PPH Stylist App — FastAPI backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
# Alembic env + autogenerated migrations are generated code.
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
# UP007/UP045 would rewrite Optional["Model"] to "Model" | None, which breaks
# SQLModel's forward-referenced relationships (evaluated at runtime without
# `from __future__ import annotations`). Keep Optional[...] for those.
ignore = ["E501", "UP007", "UP045"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection defaults (Depends/Header/Query/…) are idiomatic.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "app.api.deps.require_role",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
